<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- SIGNAL-95's icon: the title bar's little radio as 16x16 pixel art, in
       the app's own palette (putty, chalk, shade, ink, pine, tube,
       phosphor). One unit is one pixel at 16px. -->
  <!-- antenna: the palette's mid grey, not ink; it has to read on a dark
       tab bar (an iPad's) as well as a light one, and it is half of what
       says "radio" at 16px. -->
  <rect x="11" y="1" width="1" height="1" fill="#7D7A72"/>
  <rect x="10" y="2" width="1" height="1" fill="#7D7A72"/>
  <rect x="9" y="3" width="1" height="1" fill="#7D7A72"/>
  <rect x="8" y="4" width="1" height="1" fill="#7D7A72"/>
  <rect x="7" y="5" width="1" height="1" fill="#7D7A72"/>
  <rect x="12" y="0" width="1" height="1" fill="#E8A33D"/>
  <!-- body: ink outline, putty face, 1px raised bevel -->
  <rect x="0" y="6" width="16" height="10" fill="#2A2925"/>
  <rect x="1" y="7" width="14" height="8" fill="#C6C3BC"/>
  <rect x="1" y="7" width="14" height="1" fill="#F4F2EC"/>
  <rect x="1" y="7" width="1" height="8" fill="#F4F2EC"/>
  <rect x="1" y="14" width="14" height="1" fill="#7D7A72"/>
  <rect x="14" y="7" width="1" height="8" fill="#7D7A72"/>
  <!-- speaker grille -->
  <rect x="3" y="9" width="1" height="1" fill="#2A2925"/>
  <rect x="5" y="9" width="1" height="1" fill="#2A2925"/>
  <rect x="4" y="10" width="1" height="1" fill="#2A2925"/>
  <rect x="6" y="10" width="1" height="1" fill="#2A2925"/>
  <rect x="3" y="11" width="1" height="1" fill="#2A2925"/>
  <rect x="5" y="11" width="1" height="1" fill="#2A2925"/>
  <rect x="4" y="12" width="1" height="1" fill="#2A2925"/>
  <rect x="6" y="12" width="1" height="1" fill="#2A2925"/>
  <!-- the dial: a little tube with a phosphor scale and a pointer -->
  <rect x="8" y="9" width="5" height="3" fill="#12140F"/>
  <rect x="8" y="10" width="5" height="1" fill="#23443A"/>
  <rect x="10" y="9" width="1" height="3" fill="#7CFF8A"/>
</svg>
